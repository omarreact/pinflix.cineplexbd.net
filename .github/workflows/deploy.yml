# Optional alternative frontend deployment.
# This workflow targets the OpenNext Worker named "pinflix" in wrangler.jsonc.
# It NEVER deploys or modifies the separate "pinflix-media-api" CDN Worker.
# Normal Pinflix UI releases are handled by the Vercel Git integration.
name: Deploy Cloudflare Frontend (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinflix-optional-cloudflare-frontend
  cancel-in-progress: false

jobs:
  deploy-frontend-worker:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || '815dd6892edc628128dc65a992086cf9' }}
    steps:
      - name: Require manual publish credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Manual Cloudflare frontend publish requires a CLOUDFLARE_API_TOKEN secret. No deployment was attempted."
            exit 1
          fi
          echo "Deploy target: Cloudflare OpenNext frontend Worker 'pinflix' (not pinflix-media-api)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-deployment.mjs
      - name: Build Cloudflare frontend Worker
        run: pnpm build:worker
      - name: Publish Cloudflare frontend Worker
        run: pnpm exec opennextjs-cloudflare deploy
